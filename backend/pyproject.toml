[project]
name = "middlegap-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3,<4",
    "pymupdf>=1.24,<2",
    "python-multipart>=0.0.18",
    "httpx>=0.27,<1",
    "reportlab>=4,<5",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
